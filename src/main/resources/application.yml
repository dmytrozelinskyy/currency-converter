server:
  port: 8080

spring:
  application:
    name: currency-converter

  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/currency}
    username: ${DB_USER:currency}
    password: ${DB_PASSWORD:dev-password}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    org.springframework: INFO

exchange:
  api:
    base-url: https://api.frankfurter.dev/v1
    timeout: 6000

