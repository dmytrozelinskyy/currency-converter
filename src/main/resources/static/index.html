<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exchange - Currency Converter</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-name">Exchange</span>
        </a>

        <nav class="tabs">
            <ul>
                <li><a href="#converter">Converter</a></li>
                <li><a href="#currencies">Currencies</a></li>
                <li><a href="#rates">Rates</a></li>
            </ul>
        </nav>

        <div class="actions">
            <button class="contact-btn" type="button">Contact</button>
        </div>
    </header>

    <section class="hero">
        <img class="hero-img" src="/images/money_bg.jpg" alt="" width="1920" height="1080">
        <div class="hero-content">
            <h1>Currency Converter</h1>
            <p class="hero-tagline">Fast, up-to-date exchange rates for every trip and transfer.</p>
        </div>
    </section>

    <main id="converter" class="converter">
        <form class="convert-form" id="convert-form">
            <div class="field">
                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount" inputmode="decimal"
                       min="0" step="any" placeholder="100" autocomplete="off" required>
            </div>

            <div class="field">
                <label for="from">From</label>
                <input type="text" id="from" name="from" placeholder="USD" maxlength="3"
                       pattern="[A-Za-z]{3}" autocapitalize="characters" autocomplete="off"
                       spellcheck="false" required>
            </div>

            <div class="field">
                <label for="to">To</label>
                <input type="text" id="to" name="to" placeholder="EUR" maxlength="3"
                       pattern="[A-Za-z]{3}" autocapitalize="characters" autocomplete="off"
                       spellcheck="false" required>
            </div>

            <button class="convert-btn" type="submit">Convert</button>
        </form>

        <p class="result" id="result" role="status"></p>

        <h2 class="history-title">Recent conversions</h2>
        <ul id="history" class="history"></ul>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
