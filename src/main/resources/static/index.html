<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <img class="logo" src="logo.svg" alt="Currency Converter Logo" />
        <nav class="tabs">
            <ul>
                <li><a href=""></a></li>
                <li><a href=""></a></li>
                <li><a href=""></a></li>
            </ul>
        </nav>
        <div class="actions">
            <button>Contact</button>
        </div>
    </header>

    <section class="hero">
        <img src="./images/money_bg.jpg" alt="Dollar Face Image" class="hero-img">
    </section>

    <main>
        <h1>Currency Converter</h1>
        <form id="convert-from">
            <input type="number" id="amount" placeholder="Amount" required>
            <input type="text" id="from" placeholder="From (e.g. USD)" maxlength="3" required>
            <input type="text" id="to" placeholder="To (e.g. EUR)" maxlength="3" required>
            <button type="submit">Convert</button>
        </form>
        <p id="result"></p>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
