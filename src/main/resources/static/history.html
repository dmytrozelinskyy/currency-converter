<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>History - Exchange</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-name">Exchange</span>
        </a>

        <nav class="tabs">
            <ul>
                <li><a href="currencies.html">Currencies</a></li>
                <li><a href="history.html">History</a></li>
            </ul>
        </nav>

        <div class="actions">
            <button class="contact-btn" type="button">Contact</button>
        </div>
    </header>


    <main class="history-page">
        <h1>Conversion History</h1>

        <table class="history-table">
            <thead>
            <tr>
                <th>Date</th><th>From</th><th>To</th>
                <th class="num">Amount</th>
                <th class="num">Result</th>
            </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>

        <p id="history-empty" hidden>
            No conversions yet. Convert something first.
        </p>

        <div class="pager">
            <button id="prev" type="button">Previous</button>
            <span id="page-info"></span>
            <button id="next" type="button">Next</button>
        </div>
    </main>

    <script src="/js/history.js"></script>
</body>
</html>
